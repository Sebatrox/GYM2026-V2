<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Gym">
<link rel="apple-touch-icon" id="appleIcon" href="">
<link rel="manifest" id="manifest" href="">
<title>Mi Gym</title>
<style>
:root{
  --bg:#000;--bg2:#1c1c1e;--bg3:#2c2c2e;--bg4:#3a3a3c;--sep:rgba(84,84,88,.55);
  --tx:#fff;--tx2:rgba(235,235,245,.6);--tx3:rgba(235,235,245,.3);
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--pink:#ff375f;--teal:#64d2ff;--indigo:#5e5ce6;
  --r1:#ff2d55;--r2:#a2f33b;--r3:#3fd9f5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Inter",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
button:active{opacity:.75}

/* Barra superior compacta (aparece al bajar) */
.nav{position:fixed;top:0;left:0;right:0;z-index:30;height:calc(44px + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:17px;background:rgba(22,22,24,.72);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);opacity:0;pointer-events:none;transition:opacity .2s}
.nav.show{opacity:1}

main{max-width:600px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 16px 0}
.tab{display:none}.tab.active{display:block;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Título grande */
.lt{padding:22px 4px 14px}
.lt-d{font-size:13px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.02em}
.lt-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:2px}
h1{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.streak{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:600;background:var(--bg2);
  padding:6px 12px;border-radius:999px;color:var(--orange)}
.streak svg{width:15px;height:15px}

/* Selector de día */
.strip{display:flex;justify-content:space-between;margin:2px 0 18px}
.ds{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.ds small{font-size:11px;font-weight:600;color:var(--tx2);text-transform:uppercase}
.ds span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:600;
  background:var(--bg2);transition:background .2s,color .2s}
.ds.today span{color:var(--red)}
.ds.on span{background:var(--tx);color:#000}
.ds.on.today span{background:var(--red);color:#fff}

/* Tarjeta principal */
.hero{display:flex;align-items:center;gap:18px;background:var(--bg2);border-radius:20px;padding:18px;margin-bottom:6px}
.hring{position:relative;width:88px;height:88px;flex:none}
.hring svg{width:100%;height:100%}
.hring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:700}
.hero h2{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hero p{font-size:15px;color:var(--tx2);margin-top:3px}
.hero .cnt{font-size:13px;font-weight:600;color:var(--green);margin-top:8px}
.foot{font-size:13px;line-height:1.45;color:var(--tx2);padding:6px 16px 4px}
.sh{font-size:13px;color:var(--tx2);text-transform:uppercase;padding:20px 16px 7px;letter-spacing:.01em}

/* Ejercicio */
.ex{background:var(--bg2);border-radius:16px;margin-bottom:10px;overflow:hidden}
.ex-h{display:flex;align-items:center;gap:12px;padding:14px 16px 0}
.ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff}
.ic svg{width:20px;height:20px}
.ex-c{flex:1;min-width:0}
.ex-n{font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.ex-m{font-size:13px;color:var(--tx2);margin-top:2px}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--bg4);flex:none;display:grid;place-items:center;
  transition:.2s;color:#000}
.chk svg{width:14px;height:14px;opacity:0;transition:opacity .2s}
.ex.done .chk,.mt.on .chk{background:var(--green);border-color:var(--green)}
.ex.done .chk svg,.mt.on .chk svg{opacity:1}
.sets{display:flex;gap:8px;padding:14px 16px;flex-wrap:wrap}
.set{width:46px;height:46px;border-radius:50%;background:var(--bg3);font-size:16px;font-weight:600;color:var(--tx2);
  transition:transform .12s,background .2s,color .2s}
.set:active{transform:scale(.9);opacity:1}
.set.on{background:var(--green);color:#000}
.row{display:flex;align-items:center;justify-content:space-between;margin-left:16px;padding:12px 16px 12px 0;
  border-top:.5px solid var(--sep);font-size:17px}
.row .inp{display:flex;align-items:center;gap:4px;color:var(--tx2)}
.row input{width:150px;text-align:right;background:none;border:0;outline:none;font-size:17px;color:var(--blue)}
.row input::placeholder{color:var(--tx3)}
details{border-top:.5px solid var(--sep);margin-left:16px}
summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:12px 16px 12px 0;
  font-size:17px;color:var(--blue);cursor:pointer}
summary::-webkit-details-marker{display:none}
summary svg{width:13px;height:13px;transition:transform .2s;color:var(--tx3)}
details[open] summary svg{transform:rotate(90deg)}
details p{font-size:15px;line-height:1.45;color:var(--tx2);padding:0 16px 14px 0}

.btn{display:block;width:100%;padding:16px;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;margin-top:10px}
.btn.red{background:var(--bg2);color:var(--red)}
.donebox{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border-radius:14px;
  background:var(--bg2);color:var(--green);font-size:17px;font-weight:600;margin-top:10px}
.donebox svg{width:20px;height:20px}

/* Comidas */
.seg{display:flex;background:rgba(118,118,128,.24);border-radius:9px;padding:2px;margin:18px 0 14px}
.seg button{flex:1;padding:7px 2px;font-size:13px;font-weight:600;border-radius:7px}
.seg button.on{background:#636366;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.mtoday{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mt{background:var(--bg2);border-radius:14px;padding:14px 4px 12px;display:flex;flex-direction:column;align-items:center;
  gap:8px;font-size:12px;font-weight:600;color:var(--tx2)}
.mt.on{color:var(--tx)}
.meal{background:var(--bg2);border-radius:16px;margin-bottom:12px;overflow:hidden}
.meal-h{display:flex;align-items:center;gap:12px;padding:14px 16px}
.badge{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex:none}
.meal-n{font-size:17px;font-weight:600;letter-spacing:-.015em}
.li{margin-left:64px;padding:11px 16px 11px 0;border-top:.5px solid var(--sep);font-size:15px;line-height:1.35}
.xrow{margin-left:16px;padding:12px 16px 12px 0;border-top:.5px solid var(--sep);font-size:15px;line-height:1.35}
.xrow span{color:var(--orange);font-weight:600}
.mac{display:flex;gap:28px;margin-left:16px;padding:12px 16px 14px 0;border-top:.5px solid var(--sep);font-size:12px;color:var(--tx2);font-weight:600;text-transform:uppercase}
.mac b{display:block;color:var(--tx);font-size:20px;font-weight:700;text-transform:none;margin-top:2px}
.list{background:var(--bg2);border-radius:16px;overflow:hidden}
.lr{display:flex;align-items:center;gap:12px;padding:0 0 0 16px}
.lr .ic{width:30px;height:30px;border-radius:7px;font-size:15px}
.lr div:last-child{flex:1;padding:13px 16px 13px 0;font-size:15px;line-height:1.35;border-bottom:.5px solid var(--sep)}
.lr:last-child div:last-child{border-bottom:0}

/* Progreso */
.rcard{background:var(--bg2);border-radius:20px;padding:20px 18px;display:flex;align-items:center;gap:20px}
.rcard svg{width:132px;height:132px;flex:none}
.leg{display:flex;flex-direction:column;gap:12px}
.leg div{font-size:13px;color:var(--tx2);font-weight:600}
.leg b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{background:var(--bg2);border-radius:16px;padding:14px 16px}
.stat span{font-size:13px;color:var(--tx2);font-weight:600}
.stat b{display:block;font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.cal{background:var(--bg2);border-radius:16px;padding:14px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px 4px}
.cal small{text-align:center;font-size:11px;font-weight:600;color:var(--tx2)}
.cal i{font-style:normal;width:34px;height:34px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:500}
.cal .ok{background:var(--green);color:#000;font-weight:700}
.cal .miss{color:var(--red)}
.cal .fut{color:var(--tx3)}
.cal .now{box-shadow:inset 0 0 0 2px var(--red)}
.wrow{display:flex;align-items:center;margin-left:16px;padding:12px 16px 12px 0;font-size:17px}
.wrow input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:17px}
.wrow input::placeholder{color:var(--tx3)}
.wrow button{color:var(--blue);font-weight:600;font-size:17px}
.chart{padding:4px 16px 14px}
.chart svg{width:100%;height:110px;display:block}
.plist{margin-left:16px;border-top:.5px solid var(--sep)}
.plist div{display:flex;justify-content:space-between;padding:11px 16px 11px 0;font-size:15px;border-bottom:.5px solid var(--sep)}
.plist div:last-child{border-bottom:0}
.plist span{color:var(--tx2)}

/* Barra de pestañas */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;padding:7px 0 calc(6px + env(safe-area-inset-bottom));
  background:rgba(22,22,24,.78);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:#8e8e93}
.tabbar svg{width:26px;height:26px}
.tabbar button.on{color:var(--blue)}

/* Isla de descanso */
#island{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translate(-50%,-160%) scale(.9);z-index:50;
  background:#000;border:.5px solid #2c2c2e;border-radius:999px;padding:7px 7px 7px 18px;display:flex;align-items:center;gap:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);transition:transform .4s cubic-bezier(.2,.9,.3,1.15)}
#island.show{transform:translate(-50%,0) scale(1)}
#island .lbl{font-size:12px;color:var(--orange);font-weight:600;text-transform:uppercase}
#tt{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;min-width:64px;text-align:center}
#island button{height:34px;padding:0 13px;border-radius:999px;background:var(--bg3);font-size:13px;font-weight:600}
#toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.9);opacity:0;z-index:60;
  background:rgba(44,44,46,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:20px 24px;border-radius:20px;font-size:16px;font-weight:600;text-align:center;transition:.25s;pointer-events:none;max-width:80%}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>

<div class="nav" id="nav"><span id="navT">Rutina</span></div>

<main>
  <section id="tab-rutina" class="tab active"></section>
  <section id="tab-comidas" class="tab"></section>
  <section id="tab-progreso" class="tab"></section>
</main>

<div id="island"><span class="lbl">Descanso</span><div id="tt">0:00</div><button id="tPlus">+30 s</button><button id="tStop">✕</button></div>
<div id="toast"></div>

<nav class="tabbar">
  <button data-tab="rutina" class="on" id="tb-rutina"></button>
  <button data-tab="comidas" id="tb-comidas"></button>
  <button data-tab="progreso" id="tb-progreso"></button>
</nav>

<script>
/* ===================== ÍCONOS ===================== */
const IC = {
  pesa:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="1.5" y="8.5" width="3" height="7" rx="1"/><rect x="4.5" y="6" width="3.2" height="12" rx="1.1"/><rect x="7.5" y="10.8" width="9" height="2.4" rx="1"/><rect x="16.3" y="6" width="3.2" height="12" rx="1.1"/><rect x="19.5" y="8.5" width="3" height="7" rx="1"/></svg>',
  lumbar:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="8" y="1.8" width="8" height="3.4" rx="1.7"/><rect x="7.4" y="6.6" width="9.2" height="3.4" rx="1.7"/><rect x="7" y="11.4" width="10" height="3.4" rx="1.7"/><rect x="7.4" y="16.2" width="9.2" height="3.4" rx="1.7"/><rect x="9" y="20.8" width="6" height="2.2" rx="1.1"/></svg>',
  rayo:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 1.5 4 13.5h6.5L9.5 22.5l9.5-12h-6.5z"/></svg>',
  pasos:'<svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="8" cy="6.5" rx="3" ry="4.5"/><ellipse cx="16" cy="11.5" rx="3" ry="4.5"/><rect x="6" y="12.5" width="4" height="3.4" rx="1.7"/><rect x="14" y="17.5" width="4" height="3.4" rx="1.7"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  fuego:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 1.5c.8 3.6-1.8 5.4-1.8 8.2 0 1.4.9 2.5 2.1 2.5 1.3 0 2.1-1.1 2.1-2.7 2.1 1.7 3.6 4.1 3.6 6.8A6.5 6.5 0 0 1 12 22.8a6.5 6.5 0 0 1-6.5-6.5c0-5.4 6.4-7.8 7-14.8z"/></svg>',
  cubiertos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2.5v9M4.3 2.5v5.6a2.7 2.7 0 0 0 5.4 0V2.5M7 11.5v10"/><path d="M17.5 21.5v-19c-2.4 1.4-3.8 4.3-3.8 8V14h3.8"/></svg>',
  barras:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="12" width="4.2" height="9.5" rx="1.3"/><rect x="9.9" y="7" width="4.2" height="14.5" rx="1.3"/><rect x="16.8" y="2.5" width="4.2" height="19" rx="1.3"/></svg>'
};
const TAGS = {
  Brazo:{c:'var(--pink)',i:'pesa'},
  Pantorrilla:{c:'var(--orange)',i:'rayo'},
  Lumbar:{c:'var(--teal)',i:'lumbar'},
  Pasos:{c:'var(--green)',i:'pasos'},
  _:{c:'var(--blue)',i:'pesa'}
};

/* ===================== RUTINA (Torso / Pierna / Brazos) ===================== */
const RUTINA = {
  1:{n:'Torso A',f:'Pecho · Espalda · Hombro · Brazos',ej:[
    {n:'Press banca con barra',s:3,r:'6-10',d:120,t:'Baja la barra despacio hasta rozar el pecho y sube con fuerza. Pies firmes y espalda apoyada en el banco.'},
    {n:'Jalón al pecho',s:3,r:'8-12',d:90,t:'Saca el pecho y jala la barra hacia la parte alta del pecho llevando los codos hacia abajo. Arriba estira bien los brazos.'},
    {n:'Press inclinado con mancuernas',s:3,r:'8-12',d:90,t:'Banco un poco levantado. Baja las pesas hasta sentir el pecho estirado y sube.'},
    {n:'Remo sentado en polea',s:3,r:'8-12',d:90,t:'Espalda recta. Jala hacia el ombligo y junta los omóplatos. Al regresar deja que los brazos se estiren.'},
    {n:'Elevaciones laterales',s:3,r:'12-15',d:60,t:'Sube los brazos a los lados hasta la altura del hombro, codos un poco doblados. Peso ligero.'},
    {n:'Curl inclinado con mancuernas',s:2,r:'10-12',d:60,tag:'Brazo',t:'Banco inclinado, brazos colgando. Estira bien abajo: así el bíceps crece más.'},
    {n:'Extensión de tríceps sobre la cabeza',s:2,r:'10-12',d:60,tag:'Brazo',t:'En polea o con una mancuerna a dos manos. Baja detrás de la cabeza hasta estirar bien el tríceps.'}
  ]},
  2:{n:'Pierna A + Lumbar',f:'Muslos · Pantorrilla · Zona lumbar',ej:[
    {n:'Sentadilla en Smith',s:3,r:'6-10',d:120,t:'Pies un poco adelante. Baja como si te sentaras, con la espalda recta. No redondees la espalda abajo.'},
    {n:'Prensa de piernas',s:3,r:'10-12',d:90,t:'Baja hasta donde la espalda baja siga pegada al respaldo. No estires del todo las rodillas arriba.'},
    {n:'Extensión de cuádriceps',s:3,r:'10-15',d:60,t:'Estira las piernas, aprieta 1 segundo arriba y baja lento.'},
    {n:'Curl femoral sentado',s:3,r:'10-12',d:60,t:'Sentado, lleva los talones hacia abajo y atrás. Sentado trabaja mejor que acostado.'},
    {n:'Pantorrilla de pie',s:4,r:'10-15',d:60,tag:'Pantorrilla',t:'Baja hasta estirar bien y aguanta 2 segundos abajo. Luego sube en puntas lo más alto posible.'},
    {n:'Bird dog',s:2,r:'10 c/lado',d:45,tag:'Lumbar',peso:false,t:'En cuatro puntos, estira un brazo y la pierna contraria. Aguanta 2 segundos sin mover la cadera.'},
    {n:'Plancha lateral',s:2,r:'30 seg c/lado',d:45,tag:'Lumbar',peso:false,t:'De costado sobre el antebrazo. Cuerpo recto, cadera arriba.'}
  ]},
  3:{n:'Brazos + Hombro',f:'Bíceps · Tríceps · Antebrazo · Hombro',ej:[
    {n:'Curl con barra Z',s:3,r:'8-12',d:90,tag:'Brazo',t:'Codos quietos pegados al costado. Sube sin balancear el cuerpo y baja lento.'},
    {n:'Press francés con barra Z',s:3,r:'8-12',d:90,tag:'Brazo',t:'Acostado, baja la barra detrás de la frente doblando solo los codos.'},
    {n:'Curl martillo',s:3,r:'10-12',d:60,tag:'Brazo',t:'Palmas mirándose entre sí. Engrosa el brazo y el antebrazo. Empieza con el brazo izquierdo.'},
    {n:'Tríceps en polea con cuerda',s:3,r:'10-15',d:60,tag:'Brazo',t:'Codos pegados al cuerpo. Solo se mueven los antebrazos. Abre la cuerda al final.'},
    {n:'Curl predicador (banco Scott o máquina)',s:2,r:'10-12',d:60,tag:'Brazo',t:'Brazos apoyados. Baja hasta casi estirar el brazo, sube lento.'},
    {n:'Elevaciones laterales',s:3,r:'12-15',d:60,t:'Sube los brazos a los lados hasta la altura del hombro. Peso ligero.'},
    {n:'Pájaros en máquina (hombro de atrás)',s:2,r:'15',d:60,t:'En el pec deck mirando a la máquina, abre los brazos hacia atrás.'},
    {n:'Curl de muñeca',s:2,r:'15',d:45,tag:'Brazo',t:'Antebrazos apoyados en el banco, sube y baja la pesa solo con la muñeca. Para engrosar el antebrazo.'}
  ]},
  4:{n:'Torso B',f:'Pecho · Espalda · Hombro · Brazos',ej:[
    {n:'Press inclinado en Smith',s:3,r:'6-10',d:120,t:'Banco inclinado. Baja la barra a la parte alta del pecho y sube con fuerza.'},
    {n:'Remo con mancuerna a una mano',s:3,r:'8-12 c/lado',d:90,t:'Apoya mano y rodilla en el banco. Sube la pesa hacia la cadera. Empieza con el lado izquierdo.'},
    {n:'Aperturas en máquina (pec deck)',s:3,r:'10-15',d:60,t:'Abre bien hasta sentir el pecho estirado, junta los brazos al frente apretando.'},

const ALTURA = 190;
function grasa(cm,kg){
  const rfm = 64 - 20*(ALTURA/cm);
  if(!kg) return rfm;
  const lb = kg*2.2046, inch = cm/2.54;
  const ymca = (-98.42 + 4.15*inch - 0.082*lb)/lb*100;
  return (rfm+ymca)/2;
}

function L(k){ return S.log[k] = S.log[k] || {r:{},c:{}}; }
function R(k,dia){ const l=L(k); return l.r[dia] = l.r[dia] || {s:{},w:{},hecho:false}; }
function diaHecho(k){ const l=S.log[k]; return !!(l && l.r && Object.values(l.r).some(x=>x.hecho)); }
function hechoRut(k,dia){ const l=S.log[k]; return !!(l && l.r && l.r[dia] && l.r[dia].hecho); }

function lunesDe(d){ const m=new Date(d); m.setDate(d.getDate()-((d.getDay()+6)%7)); return m; }
function racha(){
  let c=0; const d=new Date(HOY);
  if(!diaHecho(key(d))) d.setDate(d.getDate()-1);
  for(let i=0;i<500;i++){
    const wd=d.getDay();
    if(diaHecho(key(d))) c++;
    else if(!(wd===0||wd===6)) break;
    d.setDate(d.getDate()-1);
  }
  return c;
}
function fmtD(s){ return s>=60 ? (s/60)+' min' : s+' s'; }
function toast(msg){
  const t=$('#toast'); t.innerHTML=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1900);
}
function ring(list,size,w,gap){
  const c=size/2; let r=c-w/2, s=`<svg viewBox="0 0 ${size} ${size}">`;
  list.forEach(o=>{
    const C=2*Math.PI*r, p=Math.max(0,Math.min(1,o.p));
    s+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${o.c}" stroke-opacity=".22" stroke-width="${w}"/>`;
    if(p>0) s+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${o.c}" stroke-width="${w}" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 ${c} ${c})"/>`;
    r-=w+gap;
  });
  return s+'</svg>';
}
function header(title){
  return `<div class="lt"><div class="lt-d">${FECHA}</div><div class="lt-row"><h1>${title}</h1>
    <div class="streak">${IC.fuego}<span class="rachaN">${racha()}</span></div></div></div>`;
}

  }
  h += `<div class="sh">${d.ej.length} ejercicios</div>`;

  d.ej.forEach((e,i)=>{

    h += `<div class="ex ${all?'done':''}" id="ex${i}">
      <div class="ex-h"><div class="ic" style="background:${tg.c}">${IC[tg.i]}</div>
        <div class="ex-c"><div class="ex-n">${e.n}</div><div class="ex-m">${e.s} × ${e.r}${e.d?' · descanso '+fmtD(e.d):''}</div></div>
        <div class="chk">${IC.check}</div></div>
      <div class="sets">${[...Array(e.s)].map((_,j)=>`<button class="set ${r.s[i+'-'+j]?'on':''}" data-i="${i}" data-j="${j}">${e.s===1?'✓':j+1}</button>`).join('')}</div>
      ${e.peso===false?'':`<div class="row"><span>Peso</span><span class="inp"><input inputmode="decimal" data-w="${i}" value="${r.w[i]!=null?r.w[i]:''}" placeholder="${S.ult[e.n]?'Última: '+S.ult[e.n]:'0'}"> kg</span></div>`}
      <details><summary>Cómo hacerlo ${IC.chev}</summary><p>${e.t}</p></details>

function finHTML(r){
  return r.hecho ? `<div class="donebox">${IC.check} Entrenamiento completado</div>`
                 : '<button class="btn" id="btnFin">Terminar entrenamiento</button>';
}
function updProg(){
  const d=RUTINA[diaSel], r=R(HK,diaSel);
  const total=d.ej.reduce((a,e)=>a+e.s,0);
  const done=Object.values(r.s).filter(Boolean).length;
  const pct=done/total;
  $('#hring').innerHTML=ring([{p:pct,c:'var(--green)'}],100,12,0)+`<b>${Math.round(pct*100)}%</b>`;
  $('#ptxt').textContent=`${done} de ${total} series`;
  return {done,total};
}
function setRacha(){ document.querySelectorAll('.rachaN').forEach(x=>x.textContent=racha()); }
function marcarHecho(){
  const r=R(HK,diaSel);
  if(r.hecho) return;
  r.hecho=true; save();
  $('#fin').innerHTML=finHTML(r);
  setRacha();
  toast('🔥<br>¡Día completado!<br><small style="color:var(--tx2);font-weight:500">Racha: '+racha()+'</small>');
}

$('#tab-rutina').addEventListener('click',ev=>{
  if(ev.target.closest('#calBtn')){ const r=R(HK,diaSel); r.cal=!r.cal; save(); $('#excal').classList.toggle('done',r.cal); return; }
  const ds=ev.target.closest('.ds');
  if(ds){ diaSel=+ds.dataset.dia; renderRutina(); return; }
  const set=ev.target.closest('.set');
  if(set){
    const i=+set.dataset.i, j=+set.dataset.j, r=R(HK,diaSel), e=RUTINA[diaSel].ej[i];
    const k=i+'-'+j; r.s[k]=!r.s[k];
    set.classList.toggle('on', r.s[k]);
    $('#ex'+i).classList.toggle('done', [...Array(e.s)].every((_,x)=>r.s[i+'-'+x]));
    save();
    const p=updProg();
    if(r.s[k]){
      try{ navigator.vibrate && navigator.vibrate(25); }catch(_){}
      if(p.done===p.total) marcarHecho();
      else if(e.d) startTimer(e.d);
    }
    return;
  }
  if(ev.target.closest('#btnFin')){
    if(updProg().done===0){ toast('Marca al menos una serie'); return; }
    marcarHecho();
  }
});
$('#tab-rutina').addEventListener('change',ev=>{
  const inp=ev.target.closest('input[data-w]');
  if(!inp) return;
  const i=+inp.dataset.w, r=R(HK,diaSel), e=RUTINA[diaSel].ej[i];
  const v=parseFloat(String(inp.value).replace(',','.'));
  if(isNaN(v)){ delete r.w[i]; inp.value=''; }
  else { r.w[i]=v; S.ult[e.n]=v; inp.value=v; }
  save();
});

let tmr=null, tEnd=0;
function startTimer(sec){
  tEnd=Date.now()+sec*1000;
  $('#island').classList.add('show');
  clearInterval(tmr); tick(); tmr=setInterval(tick,250);
}
function tick(){
  const left=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
  $('#tt').textContent=Math.floor(left/60)+':'+pad(left%60);
  if(left<=0){
    clearInterval(tmr);
    $('#tt').textContent='¡Vamos!';
    try{ navigator.vibrate && navigator.vibrate([250,120,250]); }catch(_){}
    setTimeout(()=>$('#island').classList.remove('show'),2200);
  }
}
$('#tPlus').onclick=()=>{ tEnd=Math.max(tEnd,Date.now())+30000; clearInterval(tmr); tick(); tmr=setInterval(tick,250); };
$('#tStop').onclick=()=>{ clearInterval(tmr); $('#island').classList.remove('show'); };

function renderProgreso(){
  const lun=lunesDe(HOY);
  let semana=0, piernas=0;
  for(let i=0;i<7;i++){
    const d=new Date(lun); d.setDate(lun.getDate()+i); const k=key(d);
    if(i<5 && diaHecho(k)) semana++;
    PIERNA.forEach(p=>{ if(hechoRut(k,p)) piernas++; });
  }
  const c=(S.log[HK]&&S.log[HK].c)||{};
  const comidas=['des','alm','mer','cen'].filter(k=>c[k]).length;
  const tot=Object.keys(S.log).filter(diaHecho).length;

  let h = header('Progreso');
  h += `<div class="rcard">${ring([{p:semana/5,c:'var(--r1)'},{p:piernas/2,c:'var(--r2)'},{p:comidas/4,c:'var(--r3)'}],200,20,4)}
    <div class="leg">
      <div>Entrenos semana<b style="color:var(--r1)">${semana}/5</b></div>
      <div>Días de pierna<b style="color:var(--r2)">${piernas}/2</b></div>
      <div>Comidas hoy<b style="color:var(--r3)">${comidas}/4</b></div>
    </div></div>`;
  h += `<div class="stats"><div class="stat"><span>Racha actual</span><b style="color:var(--orange)">${racha()} días</b></div>
    <div class="stat"><span>Total entrenados</span><b>${tot}</b></div></div>`;
  if(piernas<2) h += `<div class="foot">Los días de pierna son martes y viernes. No te los saltes: también ayudan a que crezca todo el cuerpo.</div>`;

  const ini=new Date(lun); ini.setDate(lun.getDate()-28);
  let cal=['L','M','X','J','V','S','D'].map(x=>`<small>${x}</small>`).join('');
  for(let i=0;i<35;i++){
    const d=new Date(ini); d.setDate(ini.getDate()+i);
    const k=key(d), ok=diaHecho(k), fut=d>HOY && k!==HK, wk=d.getDay()===0||d.getDay()===6;
    let cls=fut?'fut':(ok?'ok':(!wk && k!==HK?'miss':''));
    if(k===HK) cls+=' now';
    cal+=`<i class="${cls}">${d.getDate()}</i>`;
  }
  h += `<div class="sh">Últimas 5 semanas</div><div class="cal">${cal}</div>`;

  if(!S.cint.length){
    h += `<div class="sh">Cintura · 1 vez por semana</div><div class="list"><div class="wrow"><input id="cintIn" inputmode="decimal" placeholder="Cintura en el ombligo (cm)"><button id="cintBtn">Guardar</button></div></div>`;
  } else {
  const uc=S.cint[S.cint.length-1], up=S.peso[S.peso.length-1];
  const bf=grasa(uc.cm, up&&up.kg), bf0=grasa(S.cint[0].cm, S.peso[0]&&S.peso[0].kg);
  const dc=(uc.cm-S.cint[0].cm).toFixed(1);
  h += `<div class="sh">Cintura y grasa · 1 vez por semana</div><div class="list">
    <div class="wrow"><input id="cintIn" inputmode="decimal" placeholder="Cintura en el ombligo (cm)"><button id="cintBtn">Guardar</button></div>
    <div class="plist">
      <div><span>Grasa estimada</span><b style="color:var(--orange)">${bf.toFixed(1)} %</b></div>
      <div><span>Grasa en kg</span><b>${up?(up.kg*bf/100).toFixed(1)+' kg':'—'}</b></div>
      <div><span>Cintura actual</span><b>${uc.cm} cm</b></div>
      <div><span>Cambio de cintura</span><b style="color:${dc<=0?'var(--green)':'var(--red)'}">${dc>0?'+':''}${dc} cm</b></div>
      <div><span>Cambio de grasa</span><b>${(bf-bf0)>0?'+':''}${(bf-bf0).toFixed(1)} %</b></div>
    </div></div>
  <div class="foot">Estimación con tu altura, peso y cintura (margen de ±3 %). Lo importante es que la cintura baje mes a mes.</div>`;
  }
  h += `<div class="sh">Peso corporal · 1 vez por semana</div><div class="list">
    <div class="wrow"><input id="pesoIn" inputmode="decimal" placeholder="Tu peso de hoy en kg"><button id="pesoBtn">Guardar</button></div>`;
  if(S.peso.length){
    const arr=S.peso.slice(-12), vals=arr.map(p=>p.kg);
    const mn=Math.min(...vals)-0.5, mx=Math.max(...vals)+0.5;
    const pts=arr.map((p,i)=>[arr.length===1?150:12+i*(276/(arr.length-1)), 100-((p.kg-mn)/(mx-mn))*88]);
    const dif=(S.peso[S.peso.length-1].kg-S.peso[0].kg).toFixed(1);
    h += `<div class="chart" style="border-top:.5px solid var(--sep);padding-top:14px"><svg viewBox="0 0 300 110" preserveAspectRatio="none">
      <polyline fill="none" stroke="var(--teal)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>
      ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--teal)"/>`).join('')}</svg></div>
      <div class="plist"><div><span>Cambio total</span><b>${dif>0?'+':''}${dif} kg</b></div>
      ${S.peso.slice(-5).reverse().map(p=>`<div><span>${p.f.split('-').reverse().join('/')}</span><b>${p.kg} kg</b></div>`).join('')}</div>`;
  }
  h += `</div><button class="btn red" id="resetBtn" style="margin-top:28px">Borrar todo mi historial</button>`;
  $('#tab-progreso').innerHTML=h;
}
$('#tab-progreso').addEventListener('click',ev=>{
  if(ev.target.id==='pesoBtn'){
    const v=parseFloat(String($('#pesoIn').value).replace(',','.'));
    if(isNaN(v)||v<30||v>250){ toast('Escribe un peso válido'); return; }
    const ex=S.peso.find(p=>p.f===HK);
    if(ex) ex.kg=v; else S.peso.push({f:HK,kg:v});
    save(); renderProgreso(); toast('Peso guardado');
  }
  if(ev.target.id==='cintBtn'){
    const v=parseFloat(String($('#cintIn').value).replace(',','.'));
    if(isNaN(v)||v<50||v>180){ toast('Escribe una medida válida'); return; }
    const ex=S.cint.find(p=>p.f===HK);
    if(ex) ex.cm=v; else S.cint.push({f:HK,cm:v});
    save(); renderProgreso(); toast('Cintura guardada');
  }
  if(ev.target.id==='resetBtn' && confirm('¿Seguro? Se borrará todo tu historial.')){
    S={log:{},ult:{},peso:[],cint:[],v:3}; save(); renderAll(); toast('Historial borrado');
  }
});

/* ===================== NAVEGACIÓN ===================== */
const TABS={rutina:['Rutina',IC.pesa],comidas:['Comidas',IC.cubiertos],progreso:['Progreso',IC.barras]};
Object.entries(TABS).forEach(([k,[t,ic]])=>{ $('#tb-'+k).innerHTML=ic+t; });
document.querySelectorAll('.tabbar button').forEach(b=>{
  b.onclick=()=>{
    tabSel=b.dataset.tab;
    document.querySelectorAll('.tabbar button').forEach(x=>x.classList.toggle('on',x===b));
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    $('#tab-'+tabSel).classList.add('active');
    $('#navT').textContent=TABS[tabSel][0];
    if(tabSel==='progreso') renderProgreso();
    if(tabSel==='comidas') renderComidas();
    window.scrollTo(0,0);
  };
});
window.addEventListener('scroll',()=>$('#nav').classList.toggle('show',window.scrollY>60),{passive:true});

function renderAll(){ renderRutina(); renderComidas(); renderProgreso(); }

/* ===================== ÍCONO ===================== */
function mkIcon(sz){
  const c=document.createElement('canvas'); c.width=c.height=sz;
  const x=c.getContext('2d');
  x.fillStyle='#000'; x.fillRect(0,0,sz,sz);
  const cx=sz/2, w=sz*.085;
  [[0.36,'#ff2d55'],[0.26,'#a2f33b'],[0.16,'#3fd9f5']].forEach(([r,col],i)=>{
    x.lineWidth=w; x.lineCap='round';
    x.strokeStyle=col+'44'; x.beginPath(); x.arc(cx,cx,sz*r,0,Math.PI*2); x.stroke();
    x.strokeStyle=col; x.beginPath(); x.arc(cx,cx,sz*r,-Math.PI/2,-Math.PI/2+Math.PI*2*[.8,.65,.9][i]); x.stroke();
  });
  return c.toDataURL('image/png');
}
try{
  const i180=mkIcon(180), i192=mkIcon(192), i512=mkIcon(512);
  $('#appleIcon').href=i180;
  const man={name:'Mi Gym',short_name:'Mi Gym',start_url:location.href.split('#')[0],display:'standalone',
    background_color:'#000000',theme_color:'#000000',
    icons:[{src:i192,sizes:'192x192',type:'image/png',purpose:'any maskable'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
  $('#manifest').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(man));
}catch(e){}

renderAll();
</script>
